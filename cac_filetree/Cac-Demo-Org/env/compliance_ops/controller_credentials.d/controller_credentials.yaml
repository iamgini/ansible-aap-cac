---
controller_credentials:
  # SSH credential for Linux scan targets and report server
  - credential_type: Machine
    name: Compliance-Linux-Machine
    organization: Compliance-Ops
    description: SSH credential for Linux compliance targets and report server
    inputs:
      username: ansible
      become_method: sudo
      become_username: root

  # WinRM credential for Windows hardening targets
  - credential_type: Machine
    name: Compliance-Windows-Machine
    organization: Compliance-Ops
    description: WinRM credential for Windows CIS/STIG hardening targets
    inputs:
      username: ansible_svc

  # Git SCM credential for committing generated remediation playbooks
  - credential_type: Source Control
    name: Compliance-SCM
    organization: Compliance-Ops
    description: Git credential for committing remediation playbooks to repository
    inputs:
      username: automation
