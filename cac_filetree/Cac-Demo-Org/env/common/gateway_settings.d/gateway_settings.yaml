---
# AAP Gateway Platform Settings (AAP 2.5+)
# Valid keys sourced from: /api/gateway/v1/settings/all/
# NOTE: Settings not accepted by gateway API are commented out.
#       Controller-specific settings belong in controller_settings.d/
gateway_settings:
  # Session Settings
  SESSION_COOKIE_AGE: 1800
  # Session cookie timeout in seconds (30 minutes)

  # SESSION_COOKIE_SECURE: true
  # Not valid in gateway API or controller API (AAP 2.5+ verified)

  CSRF_TRUSTED_ORIGINS:
    - "https://aap.example.com"
    - "https://automation.example.com"
  # Trusted origins for CSRF protection

  # SESSIONS_PER_USER: 3
  # Not a gateway setting - active in controller_settings.d/ui_settings.yaml

  # Authentication
  ALLOW_OAUTH2_FOR_EXTERNAL_USERS: false
  # Allow OAuth2 for external users

  LOGIN_REDIRECT_OVERRIDE: ""
  # Override default login redirect URL

  # LOGOUT_REDIRECT_OVERRIDE: ""
  # Not valid in gateway API or controller API (AAP 2.5+ verified)

  # Platform Security
  # REMOTE_HOST_HEADERS:
  #   - "HTTP_X_FORWARDED_FOR"
  #   - "REMOTE_ADDR"
  # Not a gateway setting - active in controller_settings.d/controller_settings.yaml

  # PROXY_IP_ALLOWED_LIST: []
  # Not a gateway setting - active in controller_settings.d/controller_settings.yaml

  # Logging and Audit
  # LOGGING_AGGREGATOR_ENABLED: false
  # Not a gateway setting - controller uses LOG_AGGREGATOR_ENABLED in controller_settings.d/settings.yaml

  # LOGGING_AGGREGATOR_LEVEL: "INFO"
  # Not a gateway setting - controller uses LOG_AGGREGATOR_LEVEL in controller_settings.d/settings.yaml

  # License and Subscription
  SUBSCRIPTIONS_USERNAME: ""
  # Red Hat customer portal username (leave empty for manifest-based licensing)

  SUBSCRIPTIONS_PASSWORD: ""
  # Red Hat customer portal password

  # Custom Branding (gateway uses lowercase keys)
  custom_login_info: "Welcome to Enterprise Automation Platform"
  # Custom login page message

  custom_logo: ""
  # Custom logo URL or base64 encoded image

  # Analytics and Telemetry
  INSIGHTS_TRACKING_STATE: false
  # Enable Red Hat Insights tracking

  AUTOMATION_ANALYTICS_GATHER_INTERVAL: 14400
  # Analytics data gathering interval in seconds (4 hours)

  # AUTOMATION_ANALYTICS_LAST_GATHER: null
  # Not returned as a writable key in /api/gateway/v1/settings/all/
