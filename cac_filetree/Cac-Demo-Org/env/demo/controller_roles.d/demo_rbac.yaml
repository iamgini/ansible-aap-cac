---
# RBAC for demo/ env resources (Cac-Demo-Inventory, HW-* and demo templates)
# Only applied when running with env=demo
controller_roles:

  # Inventory Permissions - Cac-Demo-Inventory
  - inventory: Cac-Demo-Inventory
    team: cac-team-101
    role: admin

  - inventory: Cac-Demo-Inventory
    team: cac-team-102
    role: use

  - inventory: Cac-Demo-Inventory
    user: jsmith
    role: admin

  - inventory: Cac-Demo-Inventory
    user: jdoe
    role: use

  # Job Template Permissions - Hello World templates
  - job_template: "HW-01-Daily-Morning-Check"
    team: cac-team-101
    role: execute

  - job_template: "HW-02-Hourly-Monitor"
    team: cac-team-101
    role: execute

  - job_template: "HW-03-Weekly-Report"
    team: cac-team-101
    role: admin

  - job_template: "HW-01-Daily-Morning-Check"
    team: cac-team-102
    role: execute

  - job_template: "HW-02-Hourly-Monitor"
    team: cac-team-102
    role: execute

  - job_template: "HW-03-Weekly-Report"
    user: jsmith
    role: admin

  - job_template: "HW-04-End-of-Day-Cleanup"
    user: jsmith
    role: execute

  # Job Template Permissions - Demo list templates
  - job_template: "000-List-to-String"
    team: cac-team-101
    role: execute

  - job_template: "001-List-to-String-CaC"
    team: cac-team-102
    role: execute
