---
controller_credentials:
  - credential_type: Red Hat Ansible Automation Platform
    name: aap_secure_aap_credential
    organization: Cac-Demo-Org
    description: AAP gateway credential for security scan API checks (read access for scan, write for remediate)
    inputs:
      host: "{{ aap_hostname }}"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"
      verify_ssl: false

  - credential_type: Machine
    name: aap_secure_machine_credential
    organization: Cac-Demo-Org
    description: SSH credential for AAP host-level and managed node security checks
    inputs:
      username: ansible
      become_method: sudo
      become_username: root
